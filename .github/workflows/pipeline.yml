name: Pipeline CI/CD Calculatrice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (style du code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 . --max-line-length=100

  test:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v --cov=calculatrice --cov-report=term-missing
 
  build:
    name: Construction du paquet et du site
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && cp calculatrice.py dist/
      - uses: actions/upload-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/
      - run: cp site/index.html dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Construire l'image Docker
        run: docker build -t calculatrice:${{ github.sha }} .
      - name: Tester l'image Docker
        run: docker run --rm calculatrice:${{ github.sha }}

  deploy:
    name: Déploiement (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notification Discord (échec)
    runs-on: ubuntu-latest
    needs: [lint, test, build, deploy]
    if: failure()
    steps:
      - name: Envoyer l'alerte
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"Pipeline en échec sur $REPO (branche $BRANCH, par $AUTHOR). Détails : $RUN_URL\"}" \
            "$DISCORD_WEBHOOK"
            
